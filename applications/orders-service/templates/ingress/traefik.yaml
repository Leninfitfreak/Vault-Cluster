{{- if and .Values.global.active .Values.traefik.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.traefik.name }}
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "ingress") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingress
        app.kubernetes.io/name: {{ .Values.traefik.name }}
    spec:
      serviceAccountName: {{ .Values.traefik.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.traefik.name }}
          image: "{{ .Values.images.traefik.repository }}:{{ .Values.images.traefik.tag }}"
          imagePullPolicy: {{ .Values.images.traefik.pullPolicy }}
          args:
            - --entrypoints.web.address=:{{ .Values.traefik.containerPort }}
            - --ping=true
            - --ping.entrypoint=web
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces={{ include "orders-service.namespace" . }}
            - --api.dashboard=false
          ports:
            - name: web
              containerPort: {{ .Values.traefik.containerPort }}
          readinessProbe:
            httpGet:
              path: /ping
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
{{ toYaml .Values.traefik.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.traefik.name }}
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "ingress") | indent 4 }}
spec:
  type: {{ .Values.traefik.serviceType }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress
  ports:
    - name: web
      port: {{ .Values.traefik.port }}
      targetPort: web
{{- end }}
