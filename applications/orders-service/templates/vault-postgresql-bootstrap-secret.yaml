{{- if .Values.global.active }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-bootstrap
  namespace: {{ include "orders-service.namespace" . }}
spec:
  vaultAuthRef: postgresql-bootstrap
  mount: kv
  type: kv-v2
  path: orders-service/postgresql-bootstrap
  refreshAfter: 30s
  destination:
    create: true
    name: {{ .Values.secrets.databaseBootstrap.name }}
{{- end }}
