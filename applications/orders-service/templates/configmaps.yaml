{{- if .Values.global.active }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.orders.name }}-app
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "orders") | indent 4 }}
data:
  server.py: |
    import json
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            if self.path == "/db-check":
                host = os.environ.get("POSTGRESQL_HOST", "postgresql")
                port = int(os.environ.get("POSTGRESQL_PORT", "5432"))
                try:
                    with socket.create_connection((host, port), timeout=3):
                        status = "pass"
                except OSError:
                    status = "fail"
                self.send_response(200 if status == "pass" else 503)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"postgresql": status}).encode())
                return
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps({"service": "orders", "secret_model": "kubernetes-secrets"}).encode())

        def log_message(self, format, *args):
            return

    HTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.frontend.name }}-app
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "frontend") | indent 4 }}
data:
  server.py: |
    import json
    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            target = os.environ.get("ORDERS_SERVICE_URL", "http://orders-service:8080")
            try:
                with urllib.request.urlopen(target + "/health", timeout=3) as response:
                    upstream = response.status
            except Exception:
                upstream = 503
            self.send_response(200 if upstream == 200 else 503)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps({"service": "frontend", "orders_status": upstream}).encode())

        def log_message(self, format, *args):
            return

    HTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
