apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vault-platform
  namespace: argocd

spec:
  description: External Vault Kubernetes integration

  sourceRepos:
    - https://github.com/Leninfitfreak/Vault-Cluster.git

  destinations:
    - namespace: vault-integration
      server: https://kubernetes.default.svc

    - namespace: vault-secrets-operator
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap

    - group: ""
      kind: Secret

    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: Deployment

    - group: batch
      kind: Job

    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: secrets.hashicorp.com
      kind: VaultConnection

    - group: secrets.hashicorp.com
      kind: VaultAuth

    - group: secrets.hashicorp.com
      kind: VaultStaticSecret

    - group: secrets.hashicorp.com
      kind: VaultDynamicSecret

    - group: secrets.hashicorp.com
      kind: VaultPKISecret