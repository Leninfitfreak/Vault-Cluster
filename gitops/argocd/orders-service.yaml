apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-service
  namespace: argocd
spec:
  project: orders-baseline
  source:
    repoURL: https://github.com/Leninfitfreak/Vault-Cluster.git
    targetRevision: main
    path: applications/orders-service
    helm:
      releaseName: orders-service
  destination:
    server: https://kubernetes.default.svc
    namespace: orders
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
