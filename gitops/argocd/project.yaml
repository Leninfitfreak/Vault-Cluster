apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: orders-baseline
  namespace: argocd

spec:
  description: Orders service local application baseline

  sourceRepos:
    - https://github.com/Leninfitfreak/Vault-Cluster.git

  destinations:
    - namespace: orders
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: networking.k8s.io
      kind: Ingress
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
    - group: secrets.hashicorp.com
      kind: VaultDynamicSecret
    - group: secrets.hashicorp.com
      kind: VaultPKISecret