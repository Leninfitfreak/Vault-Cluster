apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd

spec:
  project: vault-platform

  source:
    repoURL: https://github.com/Leninfitfreak/Vault-Cluster.git
    targetRevision: main
    path: platform/vault-secrets-operator
    helm:
      releaseName: vault-secrets-operator

  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true